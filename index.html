<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WALK LOUDER</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        background: #0a0a14;
        font-family: 'Press Start 2P', monospace;
        overflow: hidden;
      }

      body > canvas {
        box-shadow: 0 0 40px rgba(48, 48, 48, 0.4);
        filter: brightness(1.05) saturate(1.15);
        display: block;
        border: 8px solid #565663;
      }

      .scanlines-enabled::after {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(
          0deg,
          rgba(83, 83, 83, 0.55) 0px,
          rgba(0, 0, 0, 0.55) 2px,
          transparent 2px,
          transparent 4px
        );
        z-index: 10;
      }

      .title {
        position: fixed;
        top: 0;
        left: 0;
        transform: translate(-50%, -50%);
        transform-origin: center center;
        color: #fff;
        font-size: 2rem;
        text-align: center;
        white-space: nowrap;
        pointer-events: none;
        z-index: 30;
      }
    </style>
  </head>
  <body>
    <h1 class="title">WALK_LOUDER</h1>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
